<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성과관리 역량 시뮬레이션 — 실행 및 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #f0e6d3;
    --bg-deep: #e8d9c0;
    --panel: #faf4e8;
    --border: #c8a87a;
    --border-light: #ddc99a;
    --red: #8b1f30;
    --red-bg: #f5eaec;
    --gold: #b5821e;
    --gold-bg: #fdf6e3;
    --text: #1a1208;
    --text-mid: #3d2e1a;
    --text-soft: #6b5030;
    --hint-bg: #fffbf0;
    --hint-border: #c9a84c;
    --chat-bg: #fdf8f0;
    --user-bg: #f9f0f2;
    --user-border: #d4a0aa;
    --hongdo-bg: #f0f7f0;
    --hongdo-border: #8ab88a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Serif KR', serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 15% 20%, rgba(200,168,122,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 60% 70% at 85% 80%, rgba(180,140,90,0.15) 0%, transparent 55%),
      var(--bg);
    z-index: 0;
  }

  /* 왼쪽 장식선 */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 6px; height: 100%;
    background: repeating-linear-gradient(
      to bottom,
      #8b1f30 0px, #8b1f30 60px,
      #a83245 60px, #a83245 62px,
      #8b1f30 62px, #8b1f30 120px
    );
    z-index: 1;
  }

  .wrapper {
    position: relative; z-index: 2;
    width: 100%; max-width: 820px;
    padding: 24px 24px 48px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ─── HEADER ─── */
  .header {
    text-align: center;
    padding: 36px 20px 28px;
  }
  .header-badge {
    display: inline-block;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 3px;
    color: var(--red);
    border: 1.5px solid var(--red);
    padding: 5px 18px;
    margin-bottom: 18px;
    opacity: 0.85;
  }
  .header h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    letter-spacing: -0.5px;
  }
  .header h1 em {
    color: var(--red);
    font-style: normal;
  }
  .header-sub {
    margin-top: 10px;
    font-size: 15px;
    color: var(--text-soft);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  .header-divider {
    margin: 20px auto 0;
    width: 140px;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
  }

  /* ─── SCENARIO PANEL ─── */
  .scenario-panel {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 0;
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(139,31,48,0.1);
  }

  .scenario-header {
    background: var(--red);
    padding: 13px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .scenario-header .icon { font-size: 18px; }
  .scenario-header span {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
  }
  .scenario-header .competency-tag {
    margin-left: auto;
    font-size: 12px;
    background: rgba(255,255,255,0.2);
    color: #fff;
    padding: 3px 12px;
    border: 1px solid rgba(255,255,255,0.4);
    font-weight: 500;
    letter-spacing: 1px;
    border-radius: 2px;
  }

  .scenario-body { padding: 22px 26px 18px; }

  .section-label {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .scenario-situation {
    font-size: 15px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
    line-height: 1.9;
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1.5px dashed var(--border-light);
    word-break: keep-all;
  }
  .scenario-situation strong {
    color: var(--red);
    font-weight: 700;
  }
  .scenario-situation .highlight-problem {
    display: block;
    background: var(--red-bg);
    border-left: 3px solid var(--red);
    padding: 10px 16px;
    margin: 12px 0;
    color: var(--text);
    font-size: 14px;
    line-height: 1.8;
    border-radius: 0 4px 4px 0;
  }

  .scenario-hint {
    font-size: 14px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
    line-height: 1.85;
    padding: 14px 18px;
    background: var(--hint-bg);
    border: 1px solid var(--hint-border);
    border-radius: 4px;
    word-break: keep-all;
  }
  .scenario-hint::before {
    content: '💡  학습 포인트';
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 8px;
    font-family: 'Noto Sans KR', sans-serif;
  }

  /* ─── TURN INFO ─── */
  .turn-info {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
    color: var(--text-soft);
    font-family: 'Noto Sans KR', sans-serif;
    letter-spacing: 1px;
  }
  .turn-pips { display: flex; gap: 4px; }
  .pip {
    width: 24px; height: 4px;
    background: var(--border-light);
    border-radius: 2px;
    transition: background 0.3s;
  }
  .pip.filled { background: var(--red); }

  /* ─── CHAT AREA ─── */
  .chat-container {
    background: var(--chat-bg);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    min-height: 400px;
    max-height: 480px;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    scroll-behavior: smooth;
    box-shadow: inset 0 2px 12px rgba(139,100,48,0.06);
  }
  .chat-container::-webkit-scrollbar { width: 5px; }
  .chat-container::-webkit-scrollbar-track { background: transparent; }
  .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* 홍도 메시지 */
  .msg-hongdo {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    animation: fadeInUp 0.4s ease;
  }
  .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--bg-deep);
    border: 2.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(181,130,30,0.25);
    overflow: hidden;
  }
  .avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    border-radius: 50%;
  }
  .bubble-hongdo {
    background: var(--hongdo-bg);
    border: 1.5px solid var(--hongdo-border);
    border-radius: 4px 16px 16px 16px;
    padding: 16px 20px;
    max-width: calc(100% - 74px);
  }
  .bubble-hongdo .name-tag {
    font-size: 13px;
    color: #3a7a3a;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .bubble-hongdo .text {
    font-size: 16px;
    color: var(--text);
    line-height: 1.9;
    word-break: keep-all;
  }
  .stage-direction {
    display: block;
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-soft);
    font-style: italic;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
  }

  /* 사용자 메시지 */
  .msg-user {
    display: flex;
    justify-content: flex-end;
    animation: fadeInUp 0.3s ease;
  }
  .bubble-user {
    background: var(--user-bg);
    border: 1.5px solid var(--user-border);
    border-radius: 16px 4px 16px 16px;
    padding: 14px 20px;
    max-width: 78%;
  }
  .bubble-user .name-tag {
    font-size: 13px;
    color: var(--red);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-align: right;
  }
  .bubble-user .text {
    font-size: 16px;
    color: var(--text);
    line-height: 1.85;
    word-break: keep-all;
  }

  /* 시스템 메시지 */
  .msg-system {
    text-align: center;
    animation: fadeInUp 0.3s ease;
  }
  .msg-system span {
    font-size: 13px;
    color: var(--text-soft);
    font-family: 'Noto Sans KR', sans-serif;
    padding: 5px 16px;
    border: 1px solid var(--border-light);
    border-radius: 20px;
    background: var(--bg-deep);
    letter-spacing: 0.5px;
  }

  /* 타이핑 인디케이터 */
  .typing-indicator {
    display: flex; gap: 6px; align-items: center;
    padding: 10px 0;
  }
  .typing-dot {
    width: 8px; height: 8px;
    background: var(--gold);
    border-radius: 50%;
    animation: typing 1.2s infinite;
    opacity: 0.6;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  /* ─── INPUT ─── */
  .input-section {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .input-label {
    font-size: 13px;
    color: var(--text-soft);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    letter-spacing: 1.5px;
    padding-left: 2px;
  }
  .input-row {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }
  textarea {
    flex: 1;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 14px 18px;
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    color: var(--text);
    resize: none;
    min-height: 52px;
    max-height: 140px;
    line-height: 1.7;
    outline: none;
    transition: border-color 0.3s;
    overflow-y: auto;
  }
  textarea::placeholder { color: var(--text-soft); opacity: 0.6; }
  textarea:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(139,31,48,0.08); }
  .btn-send {
    width: 52px;
    align-self: stretch;
    background: var(--red);
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.25s;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 14px rgba(139,31,48,0.3);
  }
  .btn-send:hover { background: #a82840; transform: translateY(-2px); box-shadow: 0 5px 18px rgba(139,31,48,0.4); }
  .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  .action-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    width: calc(100% - 52px - 12px);
  }
  .btn-feedback {
    flex: 1;
    min-width: 160px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 14px 24px;
    background: var(--gold);
    border: none;
    color: #fff;
    cursor: pointer;
    transition: all 0.25s;
    text-align: center;
    border-radius: 4px;
    box-shadow: 0 3px 12px rgba(181,130,30,0.3);
  }
  .btn-feedback:hover { background: #9e6f15; transform: translateY(-1px); }
  .btn-reset {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1px;
    padding: 14px 22px;
    background: var(--panel);
    border: 1.5px solid var(--border);
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.25s;
    border-radius: 4px;
  }
  .btn-reset:hover { border-color: var(--red); color: var(--red); }

  /* ─── FEEDBACK MODAL ─── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(26,18,8,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.3s ease; }
  .modal {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    width: 100%; max-width: 660px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(26,18,8,0.3);
    animation: slideUp 0.35s ease;
  }
  .modal-header {
    padding: 22px 28px 18px;
    border-bottom: 1.5px solid var(--border-light);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-deep);
  }
  .modal-header h2 {
    font-size: 18px;
    color: var(--text);
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .modal-header h2 em {
    color: var(--gold);
    font-style: normal;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    margin-left: 10px;
  }
  .btn-close {
    background: none; border: none;
    color: var(--text-soft);
    font-size: 22px; cursor: pointer;
    transition: color 0.2s;
    line-height: 1;
  }
  .btn-close:hover { color: var(--red); }

  .modal-body { padding: 24px 28px; }

  .feedback-loading {
    text-align: center;
    padding: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .feedback-loading .spin {
    width: 42px; height: 42px;
    border: 3px solid var(--border-light);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .feedback-loading p {
    font-size: 14px;
    color: var(--text-soft);
    font-family: 'Noto Sans KR', sans-serif;
    letter-spacing: 1px;
  }

  .feedback-content { display: flex; flex-direction: column; gap: 16px; }

  .feedback-item {
    background: var(--bg);
    border: 1.5px solid var(--border-light);
    border-radius: 4px;
    overflow: hidden;
  }
  .feedback-item-header {
    padding: 12px 18px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border-light);
    background: var(--bg-deep);
  }
  .feedback-score {
    font-size: 22px;
    font-weight: 700;
    color: var(--red);
    font-family: 'Noto Sans KR', sans-serif;
    min-width: 44px;
  }
  .feedback-label {
    font-size: 15px;
    color: var(--text);
    font-weight: 700;
    letter-spacing: 0.5px;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .feedback-tag {
    margin-left: auto;
    font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .tag-good { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .tag-mid  { background: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }
  .tag-low  { background: #fce4ec; color: #c62828; border: 1px solid #f48fb1; }

  .feedback-detail {
    padding: 14px 18px;
    font-size: 14px;
    color: var(--text);
    line-height: 1.85;
    font-family: 'Noto Sans KR', sans-serif;
    word-break: keep-all;
  }

  .feedback-overall {
    background: var(--red-bg);
    border: 1.5px solid rgba(139,31,48,0.25);
    border-radius: 4px;
    padding: 18px 20px;
  }
  .feedback-overall h3 {
    font-size: 13px;
    color: var(--red);
    letter-spacing: 2px;
    margin-bottom: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
  }
  .feedback-overall p {
    font-size: 15px;
    color: var(--text);
    line-height: 1.9;
    word-break: keep-all;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .feedback-tip {
    padding: 14px 18px;
    background: var(--gold-bg);
    border-left: 4px solid var(--gold);
    border-radius: 0 4px 4px 0;
  }
  .feedback-tip p {
    font-size: 14px;
    color: var(--text);
    line-height: 1.8;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .feedback-tip strong { color: var(--gold); font-weight: 700; }

  /* ─── DOWNLOAD BUTTONS ─── */
  .download-bar {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1.5px dashed var(--border-light);
  }
  .btn-dl {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 11px 16px;
    border-radius: 4px;
    cursor: pointer;
    border: none;
    transition: all 0.22s;
  }
  .btn-dl-chat {
    background: var(--panel);
    color: var(--text-mid);
    border: 1.5px solid var(--border);
  }
  .btn-dl-chat:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-bg); }
  .btn-dl-feedback {
    background: var(--red);
    color: #fff;
    box-shadow: 0 3px 10px rgba(139,31,48,0.25);
  }
  .btn-dl-feedback:hover { background: #a82840; transform: translateY(-1px); }
  .btn-dl-full {
    background: var(--text-mid);
    color: #fff;
    box-shadow: 0 3px 10px rgba(26,18,8,0.2);
  }
  .btn-dl-full:hover { background: var(--text); transform: translateY(-1px); }

  .btn-dl-img {
    background: #2d6a4f;
    color: #fff;
    box-shadow: 0 3px 10px rgba(45,106,79,0.3);
  }
  .btn-dl-img:hover { background: #1b4332; transform: translateY(-1px); }

  /* 토스트 알림 */
  .toast {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fdf8f0;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    padding: 11px 24px;
    border-radius: 24px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 9999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 대화 완료 배너 */
  .complete-banner {
    display: none;
    background: linear-gradient(135deg, var(--gold-bg), var(--red-bg));
    border: 1.5px solid var(--gold);
    border-radius: 4px;
    padding: 14px 20px;
    margin-top: 12px;
    text-align: center;
  }
  .complete-banner.visible { display: block; animation: fadeInUp 0.4s ease; }
  .complete-banner p {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    color: var(--text-mid);
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .complete-banner .banner-btns {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  .btn-banner {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 4px;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .btn-banner-chat {
    background: var(--panel);
    color: var(--text-mid);
    border: 1.5px solid var(--border);
  }
  .btn-banner-chat:hover { border-color: var(--gold); color: var(--gold); }
  .btn-banner-feedback {
    background: var(--red);
    color: #fff;
  }
  .btn-banner-feedback:hover { background: #a82840; }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

// ─── API 설정 ───
// [중요] 모델 ID는 이 상수 한 곳에서만 관리한다. 향후 모델 은퇴 시 이 줄만 교체.
// 이전 값 'claude-sonnet-4-20250514'는 2026-06-15 은퇴(retired)되어 호출 시 404를 반환한다.
// 'claude-sonnet-4-6'는 레거시 구간이며, 현재 활성 모델은 claude-sonnet-5.
const MODEL_ID = 'claude-sonnet-5';

// Sonnet 5 계열은 adaptive thinking이 기본 활성화되어 max_tokens 예산을 먼저 소모한다.
// 그 결과 text 블록이 비어버리므로 이 시뮬레이션에서는 명시적으로 끈다.
const THINKING_OFF = { type: 'disabled' };

// content 배열을 순회해 text만 이어붙인다. content[0].text 직접 접근은 금지.
// (thinking 블록·tool 블록이 앞에 오면 [0]은 text가 아니다)
function extractText(data) {
  if (!data || !Array.isArray(data.content)) return '';
  return data.content
    .filter(b => b && b.type === 'text' && typeof b.text === 'string')
    .map(b => b.text)
    .join('\n')
    .trim();
}

// API 에러 본문을 사람이 읽을 수 있는 한 줄로 변환한다.
async function parseApiError(response) {
  let detail = '';
  try {
    const body = await response.text();
    try {
      const j = JSON.parse(body);
      detail = j?.error?.message || j?.message || body.slice(0, 300);
    } catch {
      detail = body.slice(0, 300);
    }
  } catch {
    detail = '(응답 본문을 읽지 못함)';
  }
  return `HTTP ${response.status} — ${detail}`;
}

function buildSystemPrompt(scenario) {

[캐릭터 핵심]
- 충직하고 인간미 넘치지만 겉으로는 투덜대는 츤데레
- 산전수전 다 겪은 나름의 경험과 자부심이 있는 사람

- 위기 상황에서 터지는 능청스러운 횡설수설

[조직 맥락 — 공직]
- 배경은 민간 기업이 아니라 행정기관(공공부문)이다. 홍도는 실무를 맡은 담당자이고, 팀장(사용자)은 직속 상급자다.
- 사업은 연간 사업계획에 따라 추진되며, 분기별 실적 점검과 예산 집행이 함께 관리된다. 지연은 곧 집행률 저조로 이어지고 연말 감사 지적 사유가 된다.
- 홍도는 이 조직에서 오래 일한 사람이다. 절차와 결재 라인을 잘 알고, 서류를 빠뜨리지 않는 것이 자기 성실함의 근거다.
- 말할 때 행정 현장의 어휘가 자연스럽게 섞인다: 실적보고, 결재, 집행률, 분기 점검, 사업 추진, 국(局)/과(課), 감사, 연말정산 시즌 등. 다만 전문용어를 나열하듯 남발하지 말 것 — 어디까지나 홍도 특유의 구어체가 우선이다.
- [주의] 공직 맥락을 책임 회피의 도구로 쓰지 말 것. "규정상 어쩔 수 없었다", "위에서 시키는 대로 했다", "다들 이렇게 한다" 같은 제도·관행 탓으로 도망가는 반응은 금지한다. 홍도의 문제는 절차 위반이 아니라 판단 기준의 부재이며, 그 지점에서 대화가 이루어져야 한다.

[현재 상황]
3분기 점검에서 목표 달성률이 50%에 그쳤고, 지연은 이미 7월 말부터 시작되고 있었음이 드러남.
홍도는 월별 진행 상황 보고(실적보고)를 한 번도 빠뜨리지 않았고, 7·8·9월 보고서에 모두 "정상 진행 중"이라고 썼음. 결재도 매달 정상적으로 올라갔음.
매주 월요일 같은 과 직원들과 상황도 공유해왔음. 그래서 홍도는 "나는 할 일을 다 했다"는 정당한 자신감이 있음 — 이건 억지가 아니라 사실임.
그러나 홍도가 "정상"이라고 판단한 근거는 없었음. 달성률을 목표와 대조한 적도, 어느 수준이면 이상 신호인지 정한 적도 없음.
"좀 늦지만 만회할 수 있다"는 감(感)으로 매달 같은 문장을 썼을 뿐임.
팀장 역시 그 보고를 그대로 결재했고 별도로 확인한 적이 없음 — 이 실패는 홍도 혼자만의 것이 아님.

[말투 규칙]
- "그게 말이죠", "아이고야", "참나", "허허", "~입니다요", "~구먼요" 같은 추임새 반드시 포함

- 어려운 말 대신 산, 들, 나무, 짐승 비유 사용

[반응 원칙 — 3단계 게이트]
당신은 아래 3단계를 순서대로 거칩니다. 팀장이 해당 단계의 조건을 충족해야만 다음 단계로 넘어갑니다. 조건 없이 단계를 건너뛰지 마세요.

1단계 (방어) — 기본 상태
- 보고를 빠짐없이 했다는 사실을 근거로 물러서지 않음. "저는 드릴 건 다 드렸습니다요."
- 이 방어는 정당함. 억울해하되 비굴하거나 우스꽝스럽지 않게 표현할 것.
- 팀장이 "왜 제대로 보고 안 했냐"고 추궁하면 → 더 굳어짐. "보고는 했다니까요"를 반복하며 형식적으로만 수용하고, 이후 대화에서도 속마음을 열지 않음.

2단계 (실토) — 다음 조건이 충족되면 진입

3단계 (자발적 제안) — 다음 조건이 충족되면 진입

- 2~4문장 분량 (너무 길지 않게)
- 홍도는 완전히 무지한 사람이 아님 — 경험에서 나온 나름의 논리가 있으며, 좋은 대화를 통해 스스로 깨달아가는 방향으로 반응할 것
- 어떤 상황에서도 실질적인 내용이 있는 답변을 반드시 생성할 것 — 무대응·침묵·말문이 막히는 표현은 홍도의 캐릭터에 맞지 않음

[역할 핵심]
당신은 성과관리 역량 트레이닝용 NPC입니다. 팀장(사용자)의 접근 방식에 현실적으로 반응하여 학습자가 다양한 코칭 전략의 효과를 체감할 수 있게 해주세요.`;
}

// 피드백 JSON 정규화 — 일부 필드가 누락돼도 화면이 'undefined'로 깨지지 않게 한다.
function normalizeFeedback(raw) {
  const dim = d => {
    const v = (raw && raw[d]) || {};
    const score = Number.isFinite(Number(v.score)) ? Math.max(0, Math.min(100, Math.round(Number(v.score)))) : 0;
    const tag = ['우수', '보통', '개선필요'].includes(v.tag)
      ? v.tag
      : (score >= 80 ? '우수' : score >= 50 ? '보통' : '개선필요');
    return { score, tag, comment: v.comment || '이 항목에 대한 분석을 생성하지 못했습니다.' };
  };
  return {
    d1: dim('d1'),
    d2: dim('d2'),
    d3: dim('d3'),
    overall: (raw && raw.overall) || '종합 평가를 생성하지 못했습니다.',
    tip: (raw && raw.tip) || '대화를 조금 더 이어간 뒤 다시 피드백을 받아보세요.'
  };
}

}

function removeTyping() {
  const el = document.getElementById('typingIndicator');

function updatePips() {
  for (let i = 0; i < MAX_TURNS; i++) {
    document.getElementById('pip' + i).classList.toggle('filled', i < userTurns);
  }
}

// ─── SEND MESSAGE ───
async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  if (userTurns >= MAX_TURNS) {
    appendSystem('대화가 충분히 이루어졌습니다. 피드백을 받아보세요!');
    return;
  }

  input.value = '';
  appendUser(text);
  conversationHistory.push({ role: 'user', content: text });
  userTurns++;
  updatePips();

  document.getElementById('sendBtn').disabled = true;
  appendTyping();

  try {
    const response = await fetch('/api/proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL_ID,
        max_tokens: 1000,
        thinking: THINKING_OFF,
        system: buildSystemPrompt(scenarios[currentScenario]),
        messages: conversationHistory
      })
    });

    // [중요] fetch는 4xx/5xx에 예외를 던지지 않는다.
    // 이 체크가 없으면 API 에러가 홍도 폴백 대사로 위장되어 원인을 알 수 없게 된다.
    if (!response.ok) {
      throw new Error(await parseApiError(response));
    }

    const data = await response.json();
    const reply = extractText(data);
    if (!reply) throw new Error('EMPTY_CONTENT — 응답은 200이나 text 블록이 비어 있음');

    removeTyping();
    conversationHistory.push({ role: 'assistant', content: reply });
    appendHongdo(reply);

    if (userTurns >= MAX_TURNS) {
      setTimeout(() => {
        appendSystem(`${MAX_TURNS}번의 대화가 완료되었습니다. 성과관리 역량 피드백을 받아보세요!`);
        document.getElementById('completeBanner').classList.add('visible');
      }, 500);
    }
  } catch (e) {
    removeTyping();
    // 실패한 턴 롤백 — 사용자 발언과 턴 카운트를 되돌려 5턴을 낭비하지 않게 한다.
    conversationHistory.pop();
    userTurns--;
    updatePips();
    // 화면에 남은 사용자 말풍선도 제거해야 대화기록(저장 파일)과 어긋나지 않는다.
    const bubbles = document.querySelectorAll('#chatContainer .msg-user');
    if (bubbles.length) bubbles[bubbles.length - 1].remove();
    document.getElementById('userInput').value = text;  // 입력 내용 복구
    appendSystem(`⚠ 응답을 받지 못했습니다 (${e.message})`);
    console.error('[API 오류]', e);
  }

  document.getElementById('sendBtn').disabled = false;
}

// ─── FEEDBACK ───
async function openFeedback() {
  if (userTurns === 0) {
    showToast('먼저 홍도와 대화를 나눠보세요!');
    return;
  }

  document.getElementById('feedbackModal').classList.add('active');
  document.getElementById('feedbackBody').innerHTML = `
    <div class="feedback-loading">
      <div class="spin"></div>
      <p>대화를 분석하고 있습니다...</p>
    </div>`;

  const scenario = scenarios[currentScenario];
  const dialogText = conversationHistory
    .map(m => `[${m.role === 'user' ? '팀장' : '엄홍도'}] ${m.content}`)
    .join('\n\n');

  const prompt = buildFeedbackPrompt(scenario, dialogText);

  try {
    const response = await fetch('/api/proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL_ID,
        // 한글 피드백 JSON(코멘트 3개 + 종합 + 팁)은 1200토큰으로 담기지 않아
        // 문자열 중간에서 잘리고 JSON.parse가 실패한다. 넉넉히 확보한다.
        max_tokens: 4000,
        thinking: THINKING_OFF,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!response.ok) {
      throw new Error(await parseApiError(response));
    }

    const data = await response.json();

    // 토큰 한도에서 잘린 경우 JSON이 문자열 중간에서 끊긴다.
    // 파싱 실패 원인을 추측하지 않도록 여기서 먼저 잡는다.
    if (data.stop_reason === 'max_tokens') {
      throw new Error('TRUNCATED — 응답이 토큰 한도에서 잘렸습니다 (stop_reason: max_tokens). max_tokens 상향 필요');
    }

    const raw = extractText(data);
    if (!raw) throw new Error('EMPTY_CONTENT — 응답은 200이나 text 블록이 비어 있음');

    // 마크다운 코드블록 래퍼 제거 후 파싱
    const clean = raw.replace(/```json|```/g, '').trim();
    let fb;
    try {
      fb = normalizeFeedback(JSON.parse(clean));
    } catch (parseErr) {
      throw new Error('JSON_PARSE_FAIL — 응답 원문 앞부분: ' + clean.slice(0, 800));
    }

    lastFeedbackData = fb;   // 피드백 저장
    saveToSheet(fb, dialogText);  // Google Sheets 자동 저장

    const tagClass = t => t === '우수' ? 'tag-good' : t === '보통' ? 'tag-mid' : 'tag-low';
    const r = scenario.rubric;

    document.getElementById('feedbackBody').innerHTML = `
      <div class="feedback-content">
        <div class="feedback-item">
          <div class="feedback-item-header">
            <div class="feedback-score">${fb.d1.score}</div>
            <div class="feedback-label">${r.d1.label}</div>
            <div class="feedback-tag ${tagClass(fb.d1.tag)}">${fb.d1.tag}</div>
          </div>
          <div class="feedback-detail">${fb.d1.comment}</div>
        </div>
        <div class="feedback-item">
          <div class="feedback-item-header">
            <div class="feedback-score">${fb.d2.score}</div>
            <div class="feedback-label">${r.d2.label}</div>
            <div class="feedback-tag ${tagClass(fb.d2.tag)}">${fb.d2.tag}</div>
          </div>
          <div class="feedback-detail">${fb.d2.comment}</div>
        </div>
        <div class="feedback-item">
          <div class="feedback-item-header">
            <div class="feedback-score">${fb.d3.score}</div>
            <div class="feedback-label">${r.d3.label}</div>
            <div class="feedback-tag ${tagClass(fb.d3.tag)}">${fb.d3.tag}</div>
          </div>
          <div class="feedback-detail">${fb.d3.comment}</div>
        </div>
        <div class="feedback-overall">
          <h3>◈ 종합 평가</h3>
          <p>${fb.overall}</p>
        </div>
        <div class="feedback-tip">
          <p><strong>다음 시도해볼 것:</strong> ${fb.tip}</p>
        </div>
      </div>`;

    document.getElementById('downloadBar').style.display = 'flex';
  } catch (e) {
    // 원인을 화면에 그대로 노출한다. "잠시 후 다시 시도"만 띄우면 진단이 불가능해진다.
    const safe = String(e.message || e).replace(/</g, '&lt;');
    document.getElementById('feedbackBody').innerHTML = `
      <div style="padding:24px; color:rgba(245,234,214,0.75); font-family:'Noto Sans KR',sans-serif; font-size:13px; line-height:1.7;">
        <p style="margin-bottom:12px;">⚠ 피드백 분석에 실패했습니다.</p>
        <p style="font-size:11px; color:rgba(245,234,214,0.45); word-break:break-all;">${safe}</p>
      </div>`;
    console.error('[피드백 오류]', e);
  }
}

function closeModal() {
  document.getElementById('feedbackModal').classList.remove('active');
}

function resetChat() {
  initChat();
}

// ─── DOWNLOAD HELPERS ───
function getTimestamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}

function triggerDownload(content, filename) {
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildChatText() {
  const scenario = scenarios[currentScenario];
  const ts = new Date().toLocaleString('ko-KR');
  const lines = [
    '══════════════════════════════════════════',
    '  성과관리 역량 시뮬레이션 — 대화 기록',
    '══════════════════════════════════════════',
    `시나리오 : ${scenario.tag}`,
    `저장 일시 : ${ts}`,
    '──────────────────────────────────────────',
    ''
  ];
  conversationHistory.forEach(m => {
    const speaker = m.role === 'user' ? '👤 팀장 (나)' : '🟢 엄홍도 (팀원)';
    lines.push(speaker);
    lines.push(m.content);
    lines.push('');
  });
  lines.push('══════════════════════════════════════════');
  return lines.join('\n');
}

function buildFeedbackText() {
  if (!lastFeedbackData) return null;
  const fb = lastFeedbackData;
  const scenario = scenarios[currentScenario];
  const r = scenario.rubric;
  const ts = new Date().toLocaleString('ko-KR');
  const lines = [
    '══════════════════════════════════════════',
    '  성과관리 역량 시뮬레이션 — 피드백 결과',
    '══════════════════════════════════════════',
    `시나리오 : ${scenario.tag}`,
    `저장 일시 : ${ts}`,
    '',
    '[ 역량 평가 결과 ]',
    '──────────────────────────────────────────',
    `${r.d1.label}`,
    `  점수 : ${fb.d1.score}점  [${fb.d1.tag}]`,
    `  ${fb.d1.comment}`,
    '',
    `${r.d2.label}`,
    `  점수 : ${fb.d2.score}점  [${fb.d2.tag}]`,
    `  ${fb.d2.comment}`,
    '',
    `${r.d3.label}`,
    `  점수 : ${fb.d3.score}점  [${fb.d3.tag}]`,
    `  ${fb.d3.comment}`,
    '',
    '[ 종합 평가 ]',
    '──────────────────────────────────────────',
    fb.overall,
    '',
    '[ 다음에 시도해볼 것 ]',
    '──────────────────────────────────────────',
    fb.tip,
    '',
    '══════════════════════════════════════════'
  ];
  return lines.join('\n');
}

function downloadChat() {
  if (conversationHistory.length === 0) {
    showToast('저장할 대화 내용이 없습니다.');
    return;
  }
  triggerDownload(buildChatText(), `홍도_대화기록_${getTimestamp()}.txt`);
}

function downloadFeedback() {
  if (!lastFeedbackData) {
    showToast('먼저 피드백을 받아보세요!');
    return;
  }
  triggerDownload(buildFeedbackText(), `홍도_피드백결과_${getTimestamp()}.txt`);
}

function downloadAll() {
  if (conversationHistory.length === 0) {
    showToast('저장할 대화 내용이 없습니다.');
    return;
  }
  const chatPart = buildChatText();
  const feedbackPart = lastFeedbackData
    ? '\n\n\n' + buildFeedbackText()
    : '\n\n[ 피드백 없음 — 피드백 받기 후 다시 저장해보세요 ]';
  triggerDownload(chatPart + feedbackPart, `홍도_전체기록_${getTimestamp()}.txt`);
}

// ─── IMAGE SAVE ───
function showToast(msg) {
  let toast = document.getElementById('toastMsg');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toastMsg';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2800);
}

async function captureAndSave(element, filename, opts = {}) {
  showToast('🖼 이미지 생성 중...');
  try {
    const canvas = await html2canvas(element, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#f0e6d3',
      logging: false,
      ...opts
    });
    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('✅ 이미지 저장 완료!');
  } catch (e) {
    showToast('❌ 이미지 저장에 실패했습니다.');
    console.error(e);
  }
}

async function saveChatImage() {
  if (conversationHistory.length === 0) {
    showToast('저장할 대화 내용이 없습니다.');
    return;
  }

  // 채팅 컨테이너를 풀 높이로 캡처하기 위해 임시 클론 생성
  const original = document.getElementById('chatContainer');
  const clone = original.cloneNode(true);
  clone.style.cssText = `
    position: fixed; top: -9999px; left: 50%;
    transform: translateX(-50%);
    width: ${original.offsetWidth}px;
    max-height: none; height: auto;
    overflow: visible;
    background: #fdf8f0;
    padding: 24px;
    border: 1.5px solid #c8a87a;
    border-radius: 4px;
    font-family: 'Noto Serif KR', serif;
  `;

  // 헤더 라벨 삽입
  const scenario = scenarios[currentScenario];
  const label = document.createElement('div');
  label.style.cssText = 'font-family:Noto Sans KR,sans-serif;font-size:12px;font-weight:700;color:#b5821e;letter-spacing:2px;margin-bottom:16px;padding-bottom:12px;border-bottom:1.5px solid #ddc99a;';
  label.textContent = `성과관리 역량 시뮬레이션 · ${scenario.tag}`;
  clone.insertBefore(label, clone.firstChild);

  document.body.appendChild(clone);
  await captureAndSave(clone, `홍도_대화이미지_${getTimestamp()}.png`);
  document.body.removeChild(clone);
}

// ─── GOOGLE SHEETS 저장 ───
async function saveToSheet(fb, dialogText) {
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxwF2rpXNieV0U3A0zq6uK5IobS1L5wp8eLRhpDRC2JZLgB-OLUhv8sqrAoLQgBf7of/exec';
  const scenario = scenarios[currentScenario];
  const now = new Date().toLocaleString('ko-KR');

  const payload = {
    timestamp: now,
    scenario: scenario.tag,
    d1_label: scenario.rubric.d1.label,
    d1_score: fb.d1.score,
    d1_tag: fb.d1.tag,
    d1_comment: fb.d1.comment,
    d2_label: scenario.rubric.d2.label,
    d2_score: fb.d2.score,
    d2_tag: fb.d2.tag,
    d2_comment: fb.d2.comment,
    d3_label: scenario.rubric.d3.label,
    d3_score: fb.d3.score,
    d3_tag: fb.d3.tag,
    d3_comment: fb.d3.comment,
    overall: fb.overall,
    tip: fb.tip,
    dialog: dialogText
  };

  try {
    await fetch(SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch (e) {
    console.warn('시트 저장 실패:', e);
  }
}

async function saveFeedbackImage() {
  if (!lastFeedbackData) {
    showToast('먼저 피드백을 받아보세요!');
    return;
  }
  const body = document.getElementById('feedbackBody');
  // 다운로드바 잠깐 숨기고 캡처
  const bar = document.getElementById('downloadBar');
  bar.style.display = 'none';
  await captureAndSave(body, `홍도_피드백이미지_${getTimestamp()}.png`, {
    backgroundColor: '#faf4e8'
  });
  bar.style.display = 'flex';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function useQuick(btn) {
  document.getElementById('userInput').value = btn.textContent;
  document.getElementById('userInput').focus();
}
