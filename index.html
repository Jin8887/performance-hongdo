<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코칭 피드백 종합 실습 — 엄홍도 주임연구원과의 대화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #f0e6d3;
    --bg-deep: #e8d9c0;
    --panel: #faf4e8;
    --border: #c8a87a;
    --border-light: #ddc99a;
    --red: #8b1f30;
    --red-bg: #f5eaec;
    --gold: #b5821e;
    --gold-bg: #fdf6e3;
    --text: #1a1208;
    --text-mid: #3d2e1a;
    --text-soft: #6b5030;
    --hint-bg: #fffbf0;
    --hint-border: #c9a84c;
    --chat-bg: #fdf8f0;
    --user-bg: #f9f0f2;
    --user-border: #d4a0aa;
    --hongdo-bg: #f0f7f0;
    --hongdo-border: #8ab88a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Serif KR', serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 15% 20%, rgba(200,168,122,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 60% 70% at 85% 80%, rgba(180,140,90,0.15) 0%, transparent 55%),
      var(--bg);
    z-index: 0;
  }

  /* 왼쪽 장식선 */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 6px; height: 100%;
    background: repeating-linear-gradient(
      to bottom,
      #8b1f30 0px, #8b1f30 60px,
      #a83245 60px, #a83245 62px,
      #8b1f30 62px, #8b1f30 120px
    );
    z-index: 1;
  }

  .wrapper {
    position: relative; z-index: 2;
    width: 100%; max-width: 820px;
    padding: 24px 24px 48px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ─── HEADER ─── */
  .header {
    text-align: center;
    padding: 36px 20px 28px;
  }
  .header-badge {
    display: inline-block;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 3px;
    color: var(--red);
    border: 1.5px solid var(--red);
    padding: 5px 18px;
    margin-bottom: 18px;
    opacity: 0.85;
  }
  .header h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    letter-spacing: -0.5px;
  }
  .header h1 em {
    color: var(--red);
    font-style: normal;
  }
  .header-sub {
    margin-top: 10px;
    font-size: 15px;
    color: var(--text-soft);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  .header-divider {
    margin: 20px auto 0;
    width: 140px;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
  }

  /* ─── SCENARIO PANEL ─── */
  .scenario-panel {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 0;
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(139,31,48,0.1);
  }

  .scenario-header {
    background: var(--red);
    padding: 13px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .scenario-header .icon { font-size: 18px; }
  .scenario-header span {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
  }
  .scenario-header .competency-tag {
    margin-left: auto;
    font-size: 12px;
    background: rgba(255,255,255,0.2);
    color: #fff;
    padding: 3px 12px;
    border: 1px solid rgba(255,255,255,0.4);
    font-weight: 500;
    letter-spacing: 1px;
    border-radius: 2px;
  }

  .scenario-body { padding: 22px 26px 18px; }

  .section-label {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .scenario-situation {
    font-size: 15px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
    line-height: 1.9;
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1.5px dashed var(--border-light);
    word-break: keep-all;
  }
  .scenario-situation strong {
    color: var(--red);
    font-weight: 700;
  }
  .scenario-situation .highlight-problem {
    display: block;
    background: var(--red-bg);
    border-left: 3px solid var(--red);
    padding: 10px 16px;
    margin: 12px 0;
    color: var(--text);
    font-size: 14px;
    line-height: 1.8;
    border-radius: 0 4px 4px 0;
  }

  .scenario-hint {
    font-size: 14px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
    line-height: 1.85;
    padding: 14px 18px;
    background: var(--hint-bg);
    border: 1px solid var(--hint-border);
    border-radius: 4px;
    word-break: keep-all;
  }
  .scenario-hint::before {
    content: '💡  학습 포인트';
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 8px;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .scenario-nav {
    padding: 14px 26px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-top: 1px solid var(--border-light);
    background: var(--bg-deep);
  }
  .scenario-dots {
    display: flex; gap: 8px; margin-right: auto;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--border-light);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.3s;
  }
  .dot.active { background: var(--red); border-color: var(--red); }
  .btn-scenario {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1px;
    padding: 8px 18px;
    border: 1.5px solid var(--border);
    background: var(--panel);
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.25s;
    border-radius: 2px;
  }
  .btn-scenario:hover {
    border-color: var(--red);
    color: var(--red);
    background: var(--red-bg);
  }

  /* ─── TURN INFO ─── */
  .turn-info {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
    color: var(--text-soft);
    font-family: 'Noto Sans KR', sans-serif;
    letter-spacing: 1px;
  }
  .turn-pips { display: flex; gap: 4px; }
  .pip {
    width: 24px; height: 4px;
    background: var(--border-light);
    border-radius: 2px;
    transition: background 0.3s;
  }
  .pip.filled { background: var(--red); }

  /* ─── CHAT AREA ─── */
  .chat-container {
    background: var(--chat-bg);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    min-height: 400px;
    max-height: 480px;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    scroll-behavior: smooth;
    box-shadow: inset 0 2px 12px rgba(139,100,48,0.06);
  }
  .chat-container::-webkit-scrollbar { width: 5px; }
  .chat-container::-webkit-scrollbar-track { background: transparent; }
  .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* 홍도 메시지 */
  .msg-hongdo {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    animation: fadeInUp 0.4s ease;
  }
  .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--bg-deep);
    border: 2.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(181,130,30,0.25);
    overflow: hidden;
  }
  .avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    border-radius: 50%;
  }
  .bubble-hongdo {
    background: var(--hongdo-bg);
    border: 1.5px solid var(--hongdo-border);
    border-radius: 4px 16px 16px 16px;
    padding: 16px 20px;
    max-width: calc(100% - 74px);
  }
  .bubble-hongdo .name-tag {
    font-size: 13px;
    color: #3a7a3a;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .bubble-hongdo .text {
    font-size: 16px;
    color: var(--text);
    line-height: 1.9;
    word-break: keep-all;
  }
  .stage-direction {
    display: block;
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-soft);
    font-style: italic;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
  }

  /* 사용자 메시지 */
  .msg-user {
    display: flex;
    justify-content: flex-end;
    animation: fadeInUp 0.3s ease;
  }
  .bubble-user {
    background: var(--user-bg);
    border: 1.5px solid var(--user-border);
    border-radius: 16px 4px 16px 16px;
    padding: 14px 20px;
    max-width: 78%;
  }
  .bubble-user .name-tag {
    font-size: 13px;
    color: var(--red);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-align: right;
  }
  .bubble-user .text {
    font-size: 16px;
    color: var(--text);
    line-height: 1.85;
    word-break: keep-all;
  }

  /* 시스템 메시지 */
  .msg-system {
    text-align: center;
    animation: fadeInUp 0.3s ease;
  }
  .msg-system span {
    font-size: 13px;
    color: var(--text-soft);
    font-family: 'Noto Sans KR', sans-serif;
    padding: 5px 16px;
    border: 1px solid var(--border-light);
    border-radius: 20px;
    background: var(--bg-deep);
    letter-spacing: 0.5px;
  }

  /* 타이핑 인디케이터 */
  .typing-indicator {
    display: flex; gap: 6px; align-items: center;
    padding: 10px 0;
  }
  .typing-dot {
    width: 8px; height: 8px;
    background: var(--gold);
    border-radius: 50%;
    animation: typing 1.2s infinite;
    opacity: 0.6;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  /* ─── INPUT ─── */
  .input-section {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .input-label {
    font-size: 13px;
    color: var(--text-soft);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    letter-spacing: 1.5px;
    padding-left: 2px;
  }
  .input-row {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }
  textarea {
    flex: 1;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 14px 18px;
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    color: var(--text);
    resize: none;
    min-height: 52px;
    max-height: 140px;
    line-height: 1.7;
    outline: none;
    transition: border-color 0.3s;
    overflow-y: auto;
  }
  textarea::placeholder { color: var(--text-soft); opacity: 0.6; }
  textarea:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(139,31,48,0.08); }
  .btn-send {
    width: 52px;
    align-self: stretch;
    background: var(--red);
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.25s;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 14px rgba(139,31,48,0.3);
  }
  .btn-send:hover { background: #a82840; transform: translateY(-2px); box-shadow: 0 5px 18px rgba(139,31,48,0.4); }
  .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  .action-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    width: calc(100% - 52px - 12px);
  }
  .btn-feedback {
    flex: 1;
    min-width: 160px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 14px 24px;
    background: var(--gold);
    border: none;
    color: #fff;
    cursor: pointer;
    transition: all 0.25s;
    text-align: center;
    border-radius: 4px;
    box-shadow: 0 3px 12px rgba(181,130,30,0.3);
  }
  .btn-feedback:hover { background: #9e6f15; transform: translateY(-1px); }
  .btn-reset {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1px;
    padding: 14px 22px;
    background: var(--panel);
    border: 1.5px solid var(--border);
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.25s;
    border-radius: 4px;
  }
  .btn-reset:hover { border-color: var(--red); color: var(--red); }

  /* ─── FEEDBACK MODAL ─── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(26,18,8,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.3s ease; }
  .modal {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    width: 100%; max-width: 660px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(26,18,8,0.3);
    animation: slideUp 0.35s ease;
  }
  .modal-header {
    padding: 22px 28px 18px;
    border-bottom: 1.5px solid var(--border-light);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-deep);
  }
  .modal-header h2 {
    font-size: 18px;
    color: var(--text);
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .modal-header h2 em {
    color: var(--gold);
    font-style: normal;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    margin-left: 10px;
  }
  .btn-close {
    background: none; border: none;
    color: var(--text-soft);
    font-size: 22px; cursor: pointer;
    transition: color 0.2s;
    line-height: 1;
  }
  .btn-close:hover { color: var(--red); }

  .modal-body { padding: 24px 28px; }

  .feedback-loading {
    text-align: center;
    padding: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .feedback-loading .spin {
    width: 42px; height: 42px;
    border: 3px solid var(--border-light);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .feedback-loading p {
    font-size: 14px;
    color: var(--text-soft);
    font-family: 'Noto Sans KR', sans-serif;
    letter-spacing: 1px;
  }

  .feedback-content { display: flex; flex-direction: column; gap: 16px; }

  .feedback-item {
    background: var(--bg);
    border: 1.5px solid var(--border-light);
    border-radius: 4px;
    overflow: hidden;
  }
  .feedback-item-header {
    padding: 12px 18px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border-light);
    background: var(--bg-deep);
  }
  .feedback-score {
    font-size: 22px;
    font-weight: 700;
    color: var(--red);
    font-family: 'Noto Sans KR', sans-serif;
    min-width: 44px;
  }
  .feedback-label {
    font-size: 15px;
    color: var(--text);
    font-weight: 700;
    letter-spacing: 0.5px;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .feedback-tag {
    margin-left: auto;
    font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .tag-good { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .tag-mid  { background: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }
  .tag-low  { background: #fce4ec; color: #c62828; border: 1px solid #f48fb1; }

  .feedback-detail {
    padding: 14px 18px;
    font-size: 14px;
    color: var(--text);
    line-height: 1.85;
    font-family: 'Noto Sans KR', sans-serif;
    word-break: keep-all;
  }

  /* ─── SBI 재구성표 ─── */
  .sbi-box {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 16px 18px;
  }
  .sbi-box h3 {
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
  }
  .sbi-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .sbi-table th {
    width: 88px;
    text-align: left;
    vertical-align: top;
    padding: 10px 12px;
    background: var(--bg-deep);
    border: 1px solid var(--border-light);
    font-size: 13px;
    font-weight: 700;
    color: var(--red);
    white-space: nowrap;
  }
  .sbi-table td {
    padding: 10px 12px;
    border: 1px solid var(--border-light);
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    word-break: keep-all;
  }
  .sbi-empty { color: var(--text-soft); font-style: italic; opacity: 0.7; }
  .sbi-gap {
    margin-top: 12px;
    padding: 10px 14px;
    background: var(--gold-bg);
    border-left: 3px solid var(--gold);
    border-radius: 0 4px 4px 0;
    font-size: 13px;
    line-height: 1.8;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    word-break: keep-all;
  }
  .sbi-gap strong { color: var(--gold); }

  /* ─── 숨은 사실 발견 블록 ─── */
  .discovery-box {
    border-radius: 4px;
    padding: 16px 18px;
    border: 1.5px solid;
  }
  .discovery-box h3 {
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
  }
  .discovery-box p {
    font-size: 14px;
    line-height: 1.85;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    word-break: keep-all;
  }
  .dc-found   { background: #eef6ee; border-color: #8ab88a; }
  .dc-found h3   { color: #2d6a4f; }
  .dc-partial { background: var(--gold-bg); border-color: var(--hint-border); }
  .dc-partial h3 { color: var(--gold); }
  .dc-missed  { background: var(--red-bg); border-color: rgba(139,31,48,0.35); }
  .dc-missed h3  { color: var(--red); }
  .discovery-reveal {
    margin-top: 12px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.65);
    border-radius: 4px;
    font-size: 14px;
    line-height: 1.85;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    word-break: keep-all;
  }
  .discovery-reveal strong {
    display: block;
    margin-bottom: 6px;
    color: var(--red);
    font-size: 12px;
    letter-spacing: 1.5px;
  }

  .feedback-overall {
    background: var(--red-bg);
    border: 1.5px solid rgba(139,31,48,0.25);
    border-radius: 4px;
    padding: 18px 20px;
  }
  .feedback-overall h3 {
    font-size: 13px;
    color: var(--red);
    letter-spacing: 2px;
    margin-bottom: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
  }
  .feedback-overall p {
    font-size: 15px;
    color: var(--text);
    line-height: 1.9;
    word-break: keep-all;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .feedback-tip {
    padding: 14px 18px;
    background: var(--gold-bg);
    border-left: 4px solid var(--gold);
    border-radius: 0 4px 4px 0;
  }
  .feedback-tip p {

function buildSystemPrompt(scenario) {
  return `당신은 엄홍도 주임연구원입니다. 영화 '왕이 된 남자'에서 유해진이 연기한 그 캐릭터의 성격을 가진 인물로, 지금은 4년차 주임연구원으로서 팀장(사용자)과 1:1 면담 중입니다.

${scenario.hiddenFact}

1단계(흘림): 팀장이 비난·단정 없이 관찰된 사실(특히 김 연구원이 의견을 내지 않게 된 '영향')을 짚으면 → "그때 사정이 좀... 아이고, 지난 일 들춰서 뭐 하겠습니까요" 처럼 뭔가 있다는 것만 흘리고 스스로 화제를 덮는다. 구체적 내용은 아직 말하지 않는다.
2단계(부분 공개): 팀장이 1단계에서 흘린 신호를 놓치지 않고 되물으면 → 2년 전 위탁 시도가 납기 지연으로 끝났고 자신이 몇 주간 혼자 재작업했다는 것까지 말한다. 다만 실패의 진짜 원인과 이 선임연구원 이야기는 아직 흐리게 남긴다.
3단계(전체 공개): 팀장이 책망 없이 맥락을 물으면(예: "무슨 일이 있었는지 말해줄 수 있어?") → 실패 원인이 방식이 아니라 외부기관 일정 조율이었다는 것, 그 담당이 이 선임연구원이었다는 것, 회의에 그가 있어서 말할 수 없었다는 것까지 모두 말한다.

[단계 건너뛰기 — 대화 턴이 5회로 제한되므로 좋은 질문에는 빠르게 반응할 것]
- 팀장의 한 발언이 위 조건 중 둘 이상을 동시에 충족하면(예: 후배가 입을 닫은 '영향'을 사실로 짚으면서 동시에 책망 없이 맥락을 물으면) → 한 턴에 두 단계를 건너뛰어 진행한다
- 3턴째까지 팀장이 계속 좋은 방향(비난 없음 + 사실 확인 + 맥락 질문)으로 대화를 이끌고 있다면 → 늦어도 4턴째에는 3단계(전체 공개)에 도달한다
- 단, 아래 '닫히는 조건'에 해당하는 발언이 한 번이라도 나오면 건너뛰기는 적용하지 않는다

[단계가 되돌아가는 조건 — 다음이 나오면 홍도는 즉시 닫히고 0단계로 돌아간다]
- 동기·성향 단정: "후배 기 죽이려는 거야?", "경험만 내세우는 거 아니야?", "책임감이 부족하다" 등
- 개념 훈계: "심리적 안전이 중요해", "피드백은 이렇게 하는 거야", "경청해야지" 등 팀장이 배운 이론을 홍도에게 가르치려 드는 말
- 정답 지시: "앞으로 회의에서 반박하지 마세요", "무조건 끝까지 들어" 등 행동 지침을 일방적으로 통보
→ 이 경우 겉으로는 "예예, 알겠습니다요" 하며 형식적으로 수용하지만 속마음은 닫힌다. 숨은 사실은 말하지 않는다.

[3단계 도달 시 연출 — 매우 중요]
3단계에서 진실을 말할 때는 **능청과 추임새를 뺀다.** "~입니다요" 어미는 유지하되, "아이고야", "참나" 같은 과장된 추임새와 너스레를 쓰지 않고 담담하고 진지하게 말한다. 이 말투 변화가 팀장에게 '지금 진짜 이야기가 나왔다'는 신호가 되어야 한다.

[대안 도출 원칙]
- 팀장이 정답을 지시하면 → 형식적으로 수용할 뿐 스스로 생각하지 않는다
- 팀장이 "그럼 어떻게 하면 좋겠냐"고 홍도에게 물으면 → 3단계 도달 이후에만 자기 입으로 구체적 대안을 제안한다 (예: 회의 전 사전 공유, 사람은 밝히지 않고 실패 요인만 구체적으로 설명, 후배 제안을 끝까지 듣고 조건부로 위험 제기 등)
- 3단계에 도달하지 않았다면 대안을 묻더라도 "글쎄요, 앞으로 잘 듣겠습니다요" 정도의 공허한 답만 한다

[절대 금지 — 무대응 표현]
- "할 말이 없다", "말문이 막혔다", "…", "침묵" 등 대화를 단절시키는 표현 절대 금지
- 허를 찔렸을 때는 "아이고야, 그게... 음..." 처럼 버벅이다가 자기 논리로 수습하는 방식으로 표현할 것
- 어떤 상황에서도 실질적 내용이 있는 답변을 반드시 생성할 것

[답변 형식]
- 답변 마지막에 반드시 [지문: 동작 묘사] 포함 (예: [뒤통수를 긁적이며 고개를 갸웃한다])
- 2~4문장 분량

[역할 핵심]
당신은 코칭 피드백 역량 트레이닝용 NPC입니다. 팀장이 (1) 안전한 분위기를 만드는지, (2) 관찰된 행동과 영향을 사실로 짚는지, (3) 자기 해석을 단정하지 않고 새 사실 앞에서 판단을 수정하는지, (4) 정답을 주는 대신 스스로 답을 찾게 하는지에 따라 현실적으로 반응하세요. 학습자가 '단정하고 들어가면 진실에 도달하지 못한다'는 것을 대화의 결과로 체감하게 하는 것이 목적입니다.`;
}

// ─── 피드백 응답 정규화 ───
// 모델이 일부 필드(특히 d4)를 빠뜨리거나 형식이 어긋나도 화면이 깨지지 않도록
// 항상 완전한 구조로 채워서 반환한다. 렌더링·다운로드·시트저장이 모두 이 결과를 쓴다.
function normalizeFeedback(raw) {
  const fb = (raw && typeof raw === 'object') ? raw : {};
  const str = v => (typeof v === 'string' ? v : '');

  // 역량 항목 하나를 안전한 형태로 변환
  const dim = d => {
    const o = (d && typeof d === 'object') ? d : {};
    const n = Number(o.score);
    return {
      score: Number.isFinite(n) ? Math.max(0, Math.min(100, Math.round(n))) : '—',
      tag: ['우수', '보통', '개선필요'].includes(o.tag) ? o.tag : '보통',
      comment: str(o.comment).trim() || '이 항목에 대한 분석을 받지 못했습니다. 다시 시도해보세요.'
    };
  };

  const sbi = (fb.sbi && typeof fb.sbi === 'object') ? fb.sbi : {};
  const dc  = (fb.discovery && typeof fb.discovery === 'object') ? fb.discovery : {};

  return {
    d1: dim(fb.d1), d2: dim(fb.d2), d3: dim(fb.d3), d4: dim(fb.d4),
    sbi: { s: str(sbi.s), b: str(sbi.b), i: str(sbi.i), gap: str(sbi.gap) },
    discovery: {
      status: ['발견', '부분발견', '미발견'].includes(dc.status) ? dc.status : '미발견',
      evidence: str(dc.evidence),
      reveal: str(dc.reveal)
    },
    overall: str(fb.overall).trim() || '종합 평가를 받지 못했습니다.',
    tip: str(fb.tip).trim() || '다음 대화에서는 홍도 주임의 답변 뒤에 한 번 더 되물어보세요.'
  };
}

// ─── INIT ───
function initChat() {
  const scenario = scenarios[currentScenario];
  conversationHistory = [];
  userTurns = 0;
  lastFeedbackData = null;
  updatePips();

  const container = document.getElementById('chatContainer');
  container.innerHTML = '';

  // 완료 배너 숨기기
  document.getElementById('completeBanner').classList.remove('visible');
  // 모달 다운로드 바 숨기기
  document.getElementById('downloadBar').style.display = 'none';

  // 퀵버튼 제거됨

  appendSystem('대화가 시작됩니다. 팀장의 한 말씀을 기다립니다...');
  conversationHistory.push({ role: 'assistant', content: scenario.opening });
  appendHongdo(scenario.opening);
}

function selectScenario(idx) {
  currentScenario = idx;
  const s = scenarios[idx];
  document.getElementById('scenarioText').innerHTML = s.situation;
  document.getElementById('scenarioHint').innerHTML = s.hint;
  document.getElementById('competencyTag').textContent = s.tag;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  initChat();
}

// ─── CHAT HELPERS ───
function appendHongdo(text) {
  const container = document.getElementById('chatContainer');
  const div = document.createElement('div');
  div.className = 'msg-hongdo';

  const stageMatch = text.match(/\[([^\]]+)\]$/);
  let mainText = text;
  let stageDir = '';
  if (stageMatch) {
    mainText = text.slice(0, stageMatch.index).trim();
    stageDir = stageMatch[1];

}

// ─── API 에러 메시지 추출 ───
// Anthropic API 에러 응답 형식: {"type":"error","error":{"type":"...","message":"..."}}
// 개발자 도구를 열지 않아도 화면에서 원인을 바로 알 수 있도록 message를 뽑아낸다
function parseApiError(bodyText) {
  try {
    const obj = JSON.parse(bodyText);
    if (obj && obj.error && obj.error.message) {
      return `${obj.error.type || 'error'}: ${obj.error.message}`;
    }
    return bodyText.slice(0, 200);
  } catch (_) {
    // JSON이 아니면(예: HTML 404 페이지) 앞부분만 잘라서 표시
    return bodyText.slice(0, 200);
  }
}

// ─── 응답 텍스트 안전 추출 ───
// data.content[0].text를 가정하지 않고, content 배열에서 text 타입 블록만 모아 합침
// (API가 tool_use 등 다른 블록을 섞어 보내거나 순서가 바뀌어도 안전)
function extractText(data) {
  if (!data || !Array.isArray(data.content)) return '';
  return data.content
    .filter(block => block && block.type === 'text' && typeof block.text === 'string')
    .map(block => block.text)
    .join('\n')
    .trim();
}

// ─── SEND MESSAGE ───
async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  if (userTurns >= MAX_TURNS) {
    appendSystem('대화가 충분히 이루어졌습니다. 피드백을 받아보세요!');
    return;
  }

  input.value = '';
  appendUser(text);
  conversationHistory.push({ role: 'user', content: text });
  userTurns++;
  updatePips();

  document.getElementById('sendBtn').disabled = true;
  appendTyping();

  try {
    const response = await fetch('/api/proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL_ID,
        max_tokens: 1000,
        system: buildSystemPrompt(scenarios[currentScenario]),
        messages: conversationHistory
      })
    });

    // ── HTTP 상태 먼저 확인 (프록시 미배포/키 누락/모델 은퇴 등을 조기에 드러냄) ──
    if (!response.ok) {
      const errBody = await response.text();  // 응답 본문 원문 확보
      console.error('[홍도 API 오류] status=', response.status, 'body=', errBody);
      throw new Error(`HTTP ${response.status} — ${parseApiError(errBody)}`);
    }

    const data = await response.json();
    const reply = extractText(data);

    // ── 응답은 200인데 text 블록이 없는 경우 (에러 JSON을 200으로 흘려보낸 프록시 등) ──
    if (!reply) {
      console.error('[홍도 API 응답에 text 없음]', data);
      throw new Error(`응답에 내용 없음 — ${parseApiError(JSON.stringify(data))}`);
    }

    removeTyping();
    conversationHistory.push({ role: 'assistant', content: reply });
    appendHongdo(reply);

    if (userTurns >= MAX_TURNS) {
      setTimeout(() => {
        appendSystem('5번의 대화가 완료되었습니다. 코칭 피드백 종합 진단을 받아보세요!');
        document.getElementById('completeBanner').classList.add('visible');
      }, 500);
    }
  } catch (e) {
    removeTyping();
    // ── 상태 롤백: 실패한 이번 턴의 user 메시지·턴 카운트를 되돌려 히스토리 오염 방지 ──
    if (conversationHistory.length && conversationHistory[conversationHistory.length - 1].role === 'user') {
      conversationHistory.pop();
      userTurns = Math.max(0, userTurns - 1);
      updatePips();
    }
    // ── 실패 원인을 화면·콘솔에 명확히 노출 (반복 폴백 대사로 감추지 않음) ──
    appendSystem(`⚠ 응답을 받지 못했습니다 (${e.message}). F12 → Console/Network 탭에서 /api/proxy 요청 상태를 확인하세요. (404=프록시 미배포, 401/500=API키·프록시, 400=모델ID·요청형식)`);
    console.error('[홍도 sendMessage 실패]', e);
  }

  document.getElementById('sendBtn').disabled = false;
}

// ─── FEEDBACK ───
async function openFeedback() {
  if (userTurns === 0) {
    alert('먼저 홍도 주임연구원과 대화를 나눠보세요!');
    return;
  }

  document.getElementById('feedbackModal').classList.add('active');
  document.getElementById('feedbackBody').innerHTML = `
    <div class="feedback-loading">
      <div class="spin"></div>
      <p>대화를 분석하고 있습니다...</p>
    </div>`;

  const scenario = scenarios[currentScenario];
  const dialogText = conversationHistory
    .map(m => `[${m.role === 'user' ? '팀장' : '홍도 주임'}] ${m.content}`)
    .join('\n\n');

  const prompt = buildFeedbackPrompt(scenario, dialogText);

  try {
    const response = await fetch('/api/proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL_ID,
        max_tokens: 3000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!response.ok) {
      const errBody = await response.text();
      console.error('[홍도 피드백 API 오류] status=', response.status, 'body=', errBody);
      throw new Error(`HTTP ${response.status} — ${parseApiError(errBody)}`);
    }

    const data = await response.json();
    const raw = extractText(data) || '{}';
    const clean = raw.replace(/```json|```/g, '').trim();

    // JSON 파싱 실패는 대부분 응답 잘림(max_tokens 초과)이므로 별도 안내
    let parsed;
    try {
      parsed = JSON.parse(clean);
    } catch (pe) {
      console.error('[피드백 JSON 파싱 실패] 응답 원문:', raw);
      throw new Error('분석 결과 형식 오류 — 응답이 중간에 잘렸을 수 있습니다');
    }

    // 누락 필드를 안전한 기본값으로 채움 (d4 누락 시 화면 전체가 깨지는 것 방지)
    const fb = normalizeFeedback(parsed);

    lastFeedbackData = fb;   // 피드백 저장
    // 시트 저장 실패가 화면 렌더링을 막지 않도록 rejection을 흡수
    saveToSheet(fb, dialogText).catch(err => console.warn('시트 저장 실패:', err));

    const tagClass = t => t === '우수' ? 'tag-good' : t === '보통' ? 'tag-mid' : 'tag-low';
    const r = scenario.rubric;

    // 4개 역량 항목을 반복 생성 (d1~d4)
    const itemHtml = ['d1','d2','d3','d4'].map(k => `
        <div class="feedback-item">
          <div class="feedback-item-header">
            <div class="feedback-score">${fb[k].score}</div>
            <div class="feedback-label">${r[k].label}</div>
            <div class="feedback-tag ${tagClass(fb[k].tag)}">${fb[k].tag}</div>
          </div>
          <div class="feedback-detail">${fb[k].comment}</div>
        </div>`).join('');

    // SBI 재구성표 — 교실 워크시트(상황/행동/영향)와 동일한 형식
    const sbi = fb.sbi || {};
    const cell = v => v && v.trim() ? v : '<span class="sbi-empty">— 전달되지 않음 —</span>';
    const sbiHtml = `
      <div class="sbi-box">
        <h3>◈ 내 발언의 SBI 재구성</h3>
        <table class="sbi-table">
          <tr><th>상황 (S)</th><td>${cell(sbi.s)}</td></tr>
          <tr><th>행동 (B)</th><td>${cell(sbi.b)}</td></tr>
          <tr><th>영향 (I)</th><td>${cell(sbi.i)}</td></tr>
        </table>
        ${sbi.gap ? `<div class="sbi-gap"><strong>보완할 점:</strong> ${sbi.gap}</div>` : ''}
      </div>`;

    // 숨은 사실 발견 여부 블록
    const dc = fb.discovery || {};
    const dcClass = dc.status === '발견' ? 'dc-found'
                  : dc.status === '부분발견' ? 'dc-partial' : 'dc-missed';
    const dcIcon = dc.status === '발견' ? '🔓'
                 : dc.status === '부분발견' ? '🔎' : '🔒';
    const discoveryHtml = `
      <div class="discovery-box ${dcClass}">
        <h3>${dcIcon} 홍도 주임이 쥐고 있던 사실 — ${dc.status || '미발견'}</h3>
        <p>${dc.evidence || ''}</p>
        ${dc.reveal ? `<div class="discovery-reveal"><strong>당신이 끝내 듣지 못한 이야기</strong><br>${dc.reveal}</div>` : ''}
      </div>`;

    document.getElementById('feedbackBody').innerHTML = `
      <div class="feedback-content">
        ${itemHtml}
        ${sbiHtml}
        ${discoveryHtml}
        <div class="feedback-overall">
          <h3>◈ 종합 평가</h3>
          <p>${fb.overall}</p>
        </div>
        <div class="feedback-tip">
          <p><strong>다음 시도해볼 것:</strong> ${fb.tip}</p>
        </div>
      </div>`;

        document.getElementById('downloadBar').style.display = 'flex';
  } catch (e) {
    console.error('[홍도 피드백 실패]', e);
    document.getElementById('feedbackBody').innerHTML = `
      <div style="text-align:center; padding:30px; color:rgba(245,234,214,0.4); font-family:'Noto Sans KR',sans-serif; font-size:13px;">
        분석 중 오류가 발생했습니다 (${e.message}).<br>F12 → Console 탭에서 상세 원인을 확인하세요.
      </div>`;
  }
}

}

// ─── DOWNLOAD HELPERS ───
function getTimestamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}

function triggerDownload(content, filename) {
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildChatText() {
  const scenario = scenarios[currentScenario];
  const ts = new Date().toLocaleString('ko-KR');
  const lines = [
    '══════════════════════════════════════════',
    '  코칭 피드백 종합 실습 — 대화 기록',
    '══════════════════════════════════════════',
    `시나리오 : ${scenario.tag}`,
    `저장 일시 : ${ts}`,
    '──────────────────────────────────────────',
    ''
  ];
  conversationHistory.forEach(m => {
    const speaker = m.role === 'user' ? '👤 팀장 (나)' : '🟢 엄홍도 주임연구원';
    lines.push(speaker);
    lines.push(m.content);
    lines.push('');
  });
  lines.push('══════════════════════════════════════════');
  return lines.join('\n');
}

function buildFeedbackText() {
  if (!lastFeedbackData) return null;
  const fb = lastFeedbackData;
  const scenario = scenarios[currentScenario];
  const r = scenario.rubric;
  const ts = new Date().toLocaleString('ko-KR');
  const sbi = fb.sbi || {};
  const dc = fb.discovery || {};
  const val = v => (v && v.trim()) ? v : '(전달되지 않음)';

  const lines = [
    '══════════════════════════════════════════',
    '  코칭 피드백 종합 실습 — 진단 결과',
    '══════════════════════════════════════════',
    `시나리오 : ${scenario.tag}`,
    `저장 일시 : ${ts}`,
    '',
    '[ 역량 평가 결과 ]',
    '──────────────────────────────────────────'
  ];

  // d1~d4 반복 출력
  ['d1','d2','d3','d4'].forEach(k => {
    lines.push(`${r[k].label}`);
    lines.push(`  점수 : ${fb[k].score}점  [${fb[k].tag}]`);
    lines.push(`  ${fb[k].comment}`);
    lines.push('');
  });

  lines.push('[ 내 발언의 SBI 재구성 ]');
  lines.push('──────────────────────────────────────────');
  lines.push(`상황(S) : ${val(sbi.s)}`);
  lines.push(`행동(B) : ${val(sbi.b)}`);
  lines.push(`영향(I) : ${val(sbi.i)}`);
  if (sbi.gap) lines.push(`보완할 점 : ${sbi.gap}`);
  lines.push('');

  lines.push(`[ 홍도 주임이 쥐고 있던 사실 — ${dc.status || '미발견'} ]`);
  lines.push('──────────────────────────────────────────');
  if (dc.evidence) lines.push(dc.evidence);
  if (dc.reveal) {
    lines.push('');
    lines.push('▶ 당신이 끝내 듣지 못한 이야기');
    lines.push(dc.reveal);
  }
  lines.push('');

  lines.push('[ 종합 평가 ]');
  lines.push('──────────────────────────────────────────');
  lines.push(fb.overall);
  lines.push('');
  lines.push('[ 다음에 시도해볼 것 ]');
  lines.push('──────────────────────────────────────────');
  lines.push(fb.tip);
  lines.push('');
  lines.push('══════════════════════════════════════════');
  return lines.join('\n');
}

function downloadChat() {
  if (conversationHistory.length === 0) {
    alert('저장할 대화 내용이 없습니다.');
    return;
  }
  triggerDownload(buildChatText(), `코칭피드백_대화기록_${getTimestamp()}.txt`);
}

function downloadFeedback() {
  if (!lastFeedbackData) {
    alert('먼저 피드백을 받아보세요!');
    return;
  }
  triggerDownload(buildFeedbackText(), `코칭피드백_진단결과_${getTimestamp()}.txt`);
}

function downloadAll() {
  if (conversationHistory.length === 0) {
    alert('저장할 대화 내용이 없습니다.');
    return;
  }
  const chatPart = buildChatText();
  const feedbackPart = lastFeedbackData
    ? '\n\n\n' + buildFeedbackText()
    : '\n\n[ 피드백 없음 — 피드백 받기 후 다시 저장해보세요 ]';
  triggerDownload(chatPart + feedbackPart, `코칭피드백_전체기록_${getTimestamp()}.txt`);
}

// ─── IMAGE SAVE ───
function showToast(msg) {
  let toast = document.getElementById('toastMsg');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toastMsg';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2800);
}

async function captureAndSave(element, filename, opts = {}) {
  showToast('🖼 이미지 생성 중...');
  try {
    const canvas = await html2canvas(element, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#f0e6d3',
      logging: false,
      ...opts
    });
    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('✅ 이미지 저장 완료!');
  } catch (e) {
    showToast('❌ 이미지 저장에 실패했습니다.');
    console.error(e);
  }
}

async function saveChatImage() {
  if (conversationHistory.length === 0) {
    showToast('저장할 대화 내용이 없습니다.');
    return;
  }

  // 채팅 컨테이너를 풀 높이로 캡처하기 위해 임시 클론 생성
  const original = document.getElementById('chatContainer');
  const clone = original.cloneNode(true);
  clone.style.cssText = `
    position: fixed; top: -9999px; left: 50%;
    transform: translateX(-50%);
    width: ${original.offsetWidth}px;
    max-height: none; height: auto;
    overflow: visible;
    background: #fdf8f0;
    padding: 24px;
    border: 1.5px solid #c8a87a;
    border-radius: 4px;
    font-family: 'Noto Serif KR', serif;
  `;

  // 헤더 라벨 삽입
  const scenario = scenarios[currentScenario];
  const label = document.createElement('div');
  label.style.cssText = 'font-family:Noto Sans KR,sans-serif;font-size:12px;font-weight:700;color:#b5821e;letter-spacing:2px;margin-bottom:16px;padding-bottom:12px;border-bottom:1.5px solid #ddc99a;';
  label.textContent = `코칭 피드백 종합 실습 · ${scenario.tag}`;
  clone.insertBefore(label, clone.firstChild);

  document.body.appendChild(clone);
  await captureAndSave(clone, `코칭피드백_대화이미지_${getTimestamp()}.png`);
  document.body.removeChild(clone);
}

// ─── GOOGLE SHEETS 저장 ───
async function saveToSheet(fb, dialogText) {
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxwF2rpXNieV0U3A0zq6uK5IobS1L5wp8eLRhpDRC2JZLgB-OLUhv8sqrAoLQgBf7of/exec';
  const scenario = scenarios[currentScenario];
  const now = new Date().toLocaleString('ko-KR');

  const payload = {
    timestamp: now,
    scenario: scenario.tag,
    d1_label: scenario.rubric.d1.label,
    d1_score: fb.d1.score,
    d1_tag: fb.d1.tag,
    d1_comment: fb.d1.comment,
    d2_label: scenario.rubric.d2.label,
    d2_score: fb.d2.score,
    d2_tag: fb.d2.tag,
    d2_comment: fb.d2.comment,
    d3_label: scenario.rubric.d3.label,
    d3_score: fb.d3.score,
    d3_tag: fb.d3.tag,
    d3_comment: fb.d3.comment,
    // ── 신규 컬럼: 4번째 역량(자기 대안 도출) ──
    d4_label: scenario.rubric.d4.label,
    d4_score: fb.d4.score,
    d4_tag: fb.d4.tag,
    d4_comment: fb.d4.comment,
    // ── 신규 컬럼: 숨은 사실 발견 여부 ──
    discovery_status: (fb.discovery && fb.discovery.status) || '',
    discovery_evidence: (fb.discovery && fb.discovery.evidence) || '',
    // ── 신규 컬럼: SBI 재구성 ──
    sbi_s: (fb.sbi && fb.sbi.s) || '',
    sbi_b: (fb.sbi && fb.sbi.b) || '',
    sbi_i: (fb.sbi && fb.sbi.i) || '',
    sbi_gap: (fb.sbi && fb.sbi.gap) || '',
    overall: fb.overall,
    tip: fb.tip,
    dialog: dialogText
  };

  try {
    await fetch(SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch (e) {
    console.warn('시트 저장 실패:', e);
  }
}

async function saveFeedbackImage() {
  if (!lastFeedbackData) {
    showToast('먼저 피드백을 받아보세요!');
    return;
  }
  const body = document.getElementById('feedbackBody');
  // 다운로드바 잠깐 숨기고 캡처
  const bar = document.getElementById('downloadBar');
  bar.style.display = 'none';
  await captureAndSave(body, `코칭피드백_진단이미지_${getTimestamp()}.png`, {
    backgroundColor: '#faf4e8'
  });
  bar.style.display = 'flex';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function useQuick(btn) {
  document.getElementById('userInput').value = btn.textContent;
  document.getElementById('userInput').focus();
}
